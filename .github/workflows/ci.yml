name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 시각 회귀 스냅샷은 렌더링 환경(OS·폰트·Chromium 빌드)에 묶인다. 러너 이미지 드리프트와
    # 개발자 macOS 차이를 없애기 위해 Playwright 공식 이미지에 고정한다. 베이스라인은
    # update-snapshots 워크플로가 같은 이미지에서 생성한다. 버전은 package.json의
    # @playwright/test와 맞춘다.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
      - run: pnpm check:chunks
      - run: pnpm test:e2e
      - run: pnpm exec cross-env PLAYWRIGHT_PRODUCTION=1 playwright test tests/e2e/performance-budget.spec.ts
      # Lighthouse LCP < 1.5s는 로컬 next start 실측 기준 4.5s로 미달 상태이며, 로컬 스로틀링
      # 영향이 커 Vercel 배포 후 실측으로 판정하기로 결정했다. 리포트는 남기되 job을 막지 않는다.
      - run: pnpm perf:lhci
        continue-on-error: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
